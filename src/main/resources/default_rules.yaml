rules_version: 3

config:
  max_depth: 15
  # Tai-e 0.5.4 Spring DI/WEC modeling; disable for non-Spring targets or tight memory budgets.
  spring_analysis: true
  # Match taint rules at reachable invoke statements even when PTA cannot resolve
  # an interface/abstract callee (for example MultipartFile.getInputStream()).
  taint_call_site_mode: true
  # Fallback for incomplete Spring classpaths where Tai-e's full Spring plugin is unsafe.
  # Service parameters are not marked as request sources; this only makes their bodies reachable.
  spring_service_entry_fallback: false
  # Persistent/cache typed-source inference: off | on | auto (default on for common projects).
  # auto disables when app classpath entries exceed persistent_source_auto_max_app_classpath.
  persistent_source_analysis: on
  persistent_source_max_patterns: 10000
  persistent_source_max_supplemental_entries: 5000
  persistent_source_auto_max_app_classpath: 120
  # P0.3: isolate Tai-e World/PTA in a worker JVM with explicit heap and diagnostics.
  resource_budget:
    worker_enabled: true
    allow_in_process_fallback: false
    max_heap_mb: 8192
    min_heap_mb: 0
    timeout_minutes: 0
    gc_log: true
    heap_dump_on_oom: true
    execution_mode: single
  # Scan packages: List package prefixes to include in the scan.
  # Important: If your business logic resides in dependencies (BOOT-INF/lib),
  # you MUST add their package prefixes here to promote them to Application Classes.
  # Leave empty to scan only the main jar (BOOT-INF/classes).
  scan_packages: 
    # - "com.example"
    # - "org.mycompany"
  auth_config:
    blocking_annotations:
      # - "com.company.security.CheckUser"
    bypass_annotations:
      # - "com.company.security.OpenApi"

sources:
  # Spring MVC
  - type: "annotation"
    value: "org.springframework.web.bind.annotation.RequestParam"
  - type: "annotation"
    value: "org.springframework.web.bind.annotation.PathVariable"
  - type: "annotation"
    value: "org.springframework.web.bind.annotation.RequestBody"
  - type: "annotation"
    value: "org.springframework.web.bind.annotation.RequestHeader"
  - type: "annotation"
    value: "org.springframework.web.bind.annotation.CookieValue"
  # Servlet
  - type: "method"
    signature: "<javax.servlet.http.HttpServletRequest: java.lang.String getParameter(java.lang.String)>"
  - type: "method"
    signature: "<javax.servlet.http.HttpServletRequest: java.lang.String getHeader(java.lang.String)>"
  - type: "method"
    signature: "<javax.servlet.http.HttpServletRequest: java.lang.String getQueryString()>"
  - type: "method"
    signature: "<javax.servlet.http.HttpServletRequest: javax.servlet.http.Cookie[] getCookies()>"

